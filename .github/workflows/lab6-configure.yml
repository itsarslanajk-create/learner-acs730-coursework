name: lab6-configure

# Scoped to this lab's folder. Apply is manual only: it creates real
# infrastructure, and a $50 term budget does not survive one per push.
on:
  push:
    paths:
      - 'lab6/**'
      - '.github/workflows/lab6-configure.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually create infrastructure (costs money)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"

jobs:
  configure:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab6/terraform
    steps:
      - uses: actions/checkout@v4

      # boto3/botocore go into the SAME Python that runs Ansible.
      - name: Install Ansible, the AWS collections and boto3
        run: |
          python3 -m pip install --quiet "ansible-core>=2.16" boto3 botocore
          ansible-galaxy collection install amazon.aws community.aws

      # A native binary pip does not ship; every SSM connection uses it.
      - name: Install the SSM Session Manager plugin
        run: |
          curl -sSfL -o /tmp/ssm.deb \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb"
          sudo dpkg -i /tmp/ssm.deb
          session-manager-plugin --version

      # Academy session credentials (short-lived), pushed by refresh-gha-creds.sh.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.3
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -input=false

      - name: terraform plan
        run: terraform plan -input=false

      - name: terraform apply
        if: inputs.apply
        run: terraform apply -input=false -auto-approve

      # THE GRADED STEP: nothing between this and the apply above.
      - name: Converge the instances with Ansible
        if: inputs.apply
        working-directory: lab6/ansible
        run: |
          for i in $(seq 1 30); do
            ansible -i inventory/ role_web -m ansible.builtin.ping && break
            echo "waiting for the SSM agent to register ($i/30)"; sleep 10
          done
          ansible-playbook -i inventory/ site.yml -l role_web

      # The runner's Terraform state disappears when the job ends, so
      # anything it built must be destroyed here or it bills forever.
      - name: terraform destroy (runner state is not kept)
        if: always() && inputs.apply
        run: terraform destroy -input=false -auto-approve
